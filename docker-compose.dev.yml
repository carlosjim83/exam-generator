# ================================
# Development Docker Compose
# ================================
# Use this for local development with hot reload
# Run: docker compose -f docker-compose.dev.yml up
#
# Services:
#   - postgres: PostgreSQL 16 with pgvector
#   - redis: Redis 7 for BullMQ queues
#   - backend: Fastify API with hot reload
#   - frontend: Next.js with hot reload

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: exam-gen-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_generator
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - exam-gen-network

  # Redis for BullMQ job queues
  redis:
    image: redis:7-alpine
    container_name: exam-gen-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - exam-gen-network

  # Backend API (Fastify with hot reload)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: exam-gen-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    # Load Azure OpenAI credentials from backend/.env
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      # Database - use 'postgres' as host (service name in docker network)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/exam_generator
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # JWT (dev only)
      JWT_SECRET: dev-secret-key-exam-generator-2026
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev-refresh-secret-key-exam-generator-2026
      JWT_REFRESH_EXPIRES_IN: 7d
      # CORS
      FRONTEND_URL: http://localhost:3000
      # OAuth Mock (no need for real credentials in dev)
      ENABLE_OAUTH_MOCK: 'true'
      # Azure Storage (placeholder for dev)
      AZURE_STORAGE_CONNECTION_STRING: placeholder
      AZURE_STORAGE_CONTAINER_NAME: documents
    volumes:
      # Mount source code for hot reload
      - ./backend/src:/app/backend/src:ro
      - ./backend/prisma:/app/backend/prisma:ro
      # Persist uploaded files
      - backend_uploads:/app/backend/uploads
      # Don't mount node_modules (use container's)
      - /app/node_modules
      - /app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - exam-gen-network

  # Frontend (Next.js with hot reload)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: exam-gen-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_USE_MOCK_OAUTH: 'true'
      # Disable Next.js telemetry
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      # Mount source code for hot reload
      - ./frontend/app:/app/frontend/app:ro
      - ./frontend/features:/app/frontend/features:ro
      - ./frontend/lib:/app/frontend/lib:ro
      - ./frontend/components:/app/frontend/components:ro
      # Don't mount node_modules (use container's)
      - /app/frontend/node_modules
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - exam-gen-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  exam-gen-network:
    driver: bridge
